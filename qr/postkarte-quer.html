<meta charset="utf-8">
<title>Karte für Kim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@300;400;600&display=swap">
<style>
/* ══ Druckkarte A6, aus einem A5-Bogen gefaltet ══════════════
   Bogen 210 × 148 mm, einseitig gedruckt, in der Mitte gefaltet.
   Links = Rückseite (QR), rechts = Vorderseite. Innen bleibt
   unbedruckt – da kannst du selbst reinschreiben.
   ═════════════════════════════════════════════════════════ */
:root{
  --ink:#16302B;        /* Tiefes Ardennengrün, die Druckfarbe */
  --ink-soft:#5C6B5F;
  --paper:#FFFFFF;      /* Das Papier selbst – spart Tinte */
  --panel:#12241F;      /* Der dunkle Bildkasten */
  --accent:#E2542E;     /* Der Camper */
  --sun:#E2A32E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#5C6B5F;font-family:"Archivo","Helvetica Neue",Arial,sans-serif}

.sheet{
  width:210mm; height:148mm; background:var(--paper);
  margin:14mm auto; position:relative; display:flex;
  box-shadow:0 4mm 12mm rgba(0,0,0,.35);
}
.panel{width:105mm;height:148mm;position:relative;padding:9mm 8mm}
.panel.front{border-left:0.3mm dashed #C8CEC6}

/* Faltmarken */
.foldmark{position:absolute;left:105mm;width:0;top:0;height:100%;pointer-events:none}
.foldmark::before,.foldmark::after{
  content:"";position:absolute;left:-2mm;width:4mm;height:0;
  border-top:0.3mm solid var(--ink-soft);
}
.foldmark::before{top:0}.foldmark::after{bottom:0}
.foldlabel{
  position:absolute;left:105mm;bottom:2mm;transform:translateX(-50%);
  font-family:"Martian Mono",monospace;font-size:5pt;letter-spacing:.2em;
  text-transform:uppercase;color:#B9C0B7;white-space:nowrap;
}

/* ── Vorderseite ────────────────────────────────────────── */
.plate{
  height:76mm;background:var(--panel);border-radius:0.8mm;overflow:hidden;
  position:relative;display:block;
}
.plate svg{display:block;width:100%;height:100%}
.front-body{padding-top:7mm;display:flex;flex-direction:column;gap:2.5mm}
.eyebrow{
  font-family:"Martian Mono",monospace;font-size:5.5pt;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-soft);
}
.name{
  font-family:"Instrument Serif",Georgia,serif;font-style:italic;
  font-size:42pt;line-height:.9;color:var(--ink);letter-spacing:-.01em;
}
.sub{
  font-family:"Martian Mono",monospace;font-size:6pt;letter-spacing:.34em;
  text-transform:uppercase;color:var(--accent);
}
.rule{height:0.3mm;background:var(--ink);opacity:.18;margin:1.5mm 0}
.front-foot{
  position:absolute;left:8mm;right:8mm;bottom:9mm;
  font-family:"Martian Mono",monospace;font-size:5.5pt;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);
  display:flex;justify-content:space-between;
}

/* ── Rückseite ──────────────────────────────────────────── */
.back{display:flex;flex-direction:column;align-items:center;text-align:center}
.back-top{margin-top:6mm}
.back .line{
  font-family:"Instrument Serif",Georgia,serif;font-style:italic;
  font-size:21pt;line-height:1.16;color:var(--ink);margin-bottom:1.5mm;
}
.back .hint{
  font-family:"Archivo",sans-serif;font-size:8pt;line-height:1.45;
  color:var(--ink-soft);max-width:70mm;margin:0 auto;
}
.qrbox{
  margin:7mm auto 4mm;width:46mm;height:46mm;padding:3mm;
  background:#fff;border:0.35mm solid var(--ink);border-radius:0.8mm;
}
.qrbox svg{display:block;width:100%;height:100%}
.url{
  font-family:"Martian Mono",monospace;font-size:6pt;letter-spacing:.04em;
  color:var(--ink-soft);word-break:break-all;max-width:76mm;line-height:1.5;
}
.back-foot{
  position:absolute;left:8mm;right:8mm;bottom:9mm;
  display:flex;align-items:center;justify-content:center;gap:2.5mm;
}
.back-foot svg{width:16mm;height:auto;display:block}
.back-foot span{
  font-family:"Martian Mono",monospace;font-size:5.5pt;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-soft);
}

/* ── Druck ──────────────────────────────────────────────── */
.notice{
  max-width:210mm;margin:0 auto 14mm;padding:6mm 8mm;background:#EFEFE9;
  border-radius:1mm;font-size:9.5pt;line-height:1.6;color:#2A3A33;
}
.notice h2{font-size:11pt;margin-bottom:2mm;font-weight:700}
.notice li{margin-left:5mm;margin-bottom:1mm}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff}
  .notice{display:none}
  .sheet{margin:31mm auto;box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ── Querformat 148 x 100 mm, Selphy-Postkarte ────────────── */
html,body{background:#fff;margin:0;padding:0}
.sheet{width:148mm;height:100mm;margin:0;box-shadow:none;display:block}
.card{
  width:148mm;height:100mm;padding:12mm 13mm;
  display:flex;align-items:center;gap:11mm;background:var(--paper);
}
.textcol{flex:1;text-align:left}
.textcol .line{
  font-family:"Instrument Serif",Georgia,serif;font-style:italic;
  font-size:21pt;line-height:1.14;color:var(--ink);margin-bottom:3mm;
}
.textcol .hint{
  font-family:"Archivo",sans-serif;font-size:8.5pt;line-height:1.5;
  color:var(--ink-soft);max-width:62mm;
}
.foot{display:flex;align-items:center;gap:3mm;margin-top:10mm}
.foot svg{width:18mm;height:auto;display:block}
.foot span{
  font-family:"Martian Mono",monospace;font-size:5.5pt;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-soft);
}
.qrcol{display:flex;flex-direction:column;align-items:center;gap:3.5mm}
.qrbox{margin:0;width:50mm;height:50mm;padding:3mm}
.qrcol .url{
  font-family:"Martian Mono",monospace;font-size:6pt;letter-spacing:.04em;
  color:var(--ink-soft);text-align:center;
}
</style>
